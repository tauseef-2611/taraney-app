# Publishes D1 content only. It intentionally skips migrations and tests.
name: Publish content

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Ingest"]
    types: [completed]

concurrency:
  group: publish-content
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export published songs
        run: npm run content:prod
      - name: Build static content
        run: npm run build
      - name: Deploy content
        run: npx wrangler pages deploy dist --project-name=taraney --branch=main --commit-dirty=true
