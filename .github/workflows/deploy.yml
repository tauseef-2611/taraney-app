# Deploys application code changes. Content-only changes use publish-content.yml.
name: Deploy application

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-application
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply taraney-db --remote
      - name: Export published songs
        run: npm run content:prod
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=taraney --branch=main --commit-dirty=true
